      # run's MPC session namespace. One directory per party, never shared.
      STOFFEL_EPOCH_STORE: /app/local-store/epochs-party-4
      # Mesh seeds: every other party. See STOFFEL_PEERS in the shared block.
      STOFFEL_PEERS: ${STOFFEL_PEERS-172.28.0.10:9000,172.28.0.11:9001,172.28.0.12:9002,172.28.0.13:9003}
      STOFFEL_CERT: /app/ids/nodes/cert4.crt
      STOFFEL_KEY: /run/secrets/node4_key
    networks:
      stoffel-net:
        ipv4_address: 172.28.0.14
    ports:
      - "127.0.0.1:9004:9004/tcp"
      - "127.0.0.1:9004:9004/udp"

  # Client 0. Started only with `--profile clients` (see the header). Its
  # certificate is mounted here and nowhere else: no party is told it, and the
  # coordinator reads it only when STOFFEL_CLIENT_CERTS pre-registers it.
  client0:
    profiles: [clients]
    configs:
      - *coordinator-pin
      - source: client0_cert
        target: /app/ids/clients/cert0.crt
    secrets:
      - client0_key
    <<: *client-common
    container_name: stoffel-client0
    hostname: client0
    environment:
      <<: *client-env
      STOFFEL_INPUTS: ${STOFFEL_CLIENT0_INPUT-3}
      STOFFEL_CLIENT_SLOT: ${STOFFEL_CLIENT0_SLOT-}
      STOFFEL_CERT: /app/ids/clients/cert0.crt
      STOFFEL_KEY: /run/secrets/client0_key
    networks:
      stoffel-net:
        ipv4_address: 172.28.0.100
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_healthy

  # Client 1. Started only with `--profile clients` (see the header). Its
  # certificate is mounted here and nowhere else: no party is told it, and the
  # coordinator reads it only when STOFFEL_CLIENT_CERTS pre-registers it.
  client1:
    profiles: [clients]
    configs:
      - *coordinator-pin
      - source: client1_cert
        target: /app/ids/clients/cert1.crt
    secrets:
      - client1_key
    <<: *client-common
    container_name: stoffel-client1
    hostname: client1
    environment:
      <<: *client-env
      STOFFEL_INPUTS: ${STOFFEL_CLIENT1_INPUT-4}
      STOFFEL_CLIENT_SLOT: ${STOFFEL_CLIENT1_SLOT-}
      STOFFEL_CERT: /app/ids/clients/cert1.crt
      STOFFEL_KEY: /run/secrets/client1_key
    networks:
      stoffel-net:
        ipv4_address: 172.28.0.101
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_healthy

networks:
  stoffel-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  stoffel-programs:
  stoffel-local-store:

configs:
  coordinator_cert:
    file: ./ids/server_cert.crt
  node0_cert:
    file: ./ids/nodes/cert0.crt
  node1_cert:
    file: ./ids/nodes/cert1.crt
  node2_cert:
    file: ./ids/nodes/cert2.crt
  node3_cert:
    file: ./ids/nodes/cert3.crt
  node4_cert:
    file: ./ids/nodes/cert4.crt
  client0_cert:
    file: ./ids/clients/cert0.crt
  client1_cert:
    file: ./ids/clients/cert1.crt

secrets:
  client0_key:
    file: ./ids/clients/key0.der
  client1_key:
    file: ./ids/clients/key1.der
  coordinator_key:
    file: ./ids/server_key.der
  node0_key:
    file: ./ids/nodes/key0.der
  node1_key:
    file: ./ids/nodes/key1.der
  node2_key:
    file: ./ids/nodes/key2.der
  node3_key:
    file: ./ids/nodes/key3.der
  node4_key:
    file: ./ids/nodes/key4.der

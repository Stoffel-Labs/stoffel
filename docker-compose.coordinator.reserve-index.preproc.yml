      PARTY_ID: "4"
      BIND_ADDR: 172.29.0.14:9004
      CLIENT_BIND_ADDR: 172.29.0.14:9104
      RPC_BIND_ADDR: 0.0.0.0:16184
      PEERS: 172.29.0.10:9000,172.29.0.11:9001,172.29.0.12:9002,172.29.0.13:9003
      CERT_PATH: /app/ids/nodes/cert4.crt

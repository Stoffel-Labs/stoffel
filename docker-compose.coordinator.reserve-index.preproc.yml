  client0:
    environment:
      # A standing node serves clients on a listener separate from its mesh
      # bind, so a client needs both: --servers for the node RPC, and
      # --client-transport-servers for the client-facing socket.
      STOFFEL_CLIENT_TRANSPORT_SERVERS: 172.29.0.10:9100,172.29.0.11:9101,172.29.0.12:9102,172.29.0.13:9103,172.29.0.14:9104

  client1:

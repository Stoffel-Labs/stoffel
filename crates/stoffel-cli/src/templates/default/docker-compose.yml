# Self-managed development topology. The participant client is intentionally
# separate; see README.md and https://docs.stoffelmpc.com/deployment/docker-local-network.
x-node: &node
  build:
    context: ..
    dockerfile: scripts/Dockerfile
  command: ["stoffel-server"]
  volumes:
    - ../deploy/local:/app/deploy/local:ro
  environment: &node-env
    STOFFEL_AUTH_TOKEN: ${STOFFEL_AUTH_TOKEN:-stoffel-local-example}
    STOFFEL_COORDINATOR_ADDRESS: coordinator:19300
    STOFFEL_RUN_BIN: /usr/local/bin/stoffel-run
  healthcheck:
    test: ["CMD-SHELL", "nc -z 127.0.0.1 $${STOFFEL_RPC_BIND_ADDRESS##*:}"]
    interval: 2s
    timeout: 2s
    retries: 30
  restart: "no"

services:
  coordinator:
    build:
      context: ..
      dockerfile: scripts/Dockerfile
    command: ["stoffel-coordinator", "serve"]
    environment:
      STOFFEL_COORDINATOR_BIND: 0.0.0.0
    volumes:
      - ../deploy/local:/app/deploy/local:ro
    ports:
      - "19300:19300"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "19300"]
      interval: 2s
      timeout: 2s
      retries: 30

  node-0:
    <<: *node
    command: ["stoffel-server", "0"]
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      <<: *node-env
      # Each node binds its MPC listener to its own service address, resolved
      # at startup, because the bootnode hands that address to the other
      # parties. Binding 0.0.0.0 would make every peer dial itself. node-0
      # serves the bootnode on this port and its party mesh on the bind port
      # + 1000 (20200).
      STOFFEL_BIND_ADDRESS: node-0:19200
      STOFFEL_RPC_BIND_ADDRESS: 0.0.0.0:19400
    ports:
      - "19400:19400"
  node-1:
    <<: *node
    command: ["stoffel-server", "1"]
    depends_on:
      coordinator:
        condition: service_healthy
      node-0:
        # Peers only need node-0's container to exist (so node-0:19200
        # resolves) and its bootnode process listening. node-0's healthcheck
        # probes its RPC port, which cannot come up until every party has
        # joined the session, so a service_healthy gate here deadlocks startup.
        condition: service_started
    environment:
      <<: *node-env
      STOFFEL_BIND_ADDRESS: node-1:19202
      STOFFEL_RPC_BIND_ADDRESS: 0.0.0.0:19401
      STOFFEL_BOOTSTRAP_ADDRESS: node-0:19200
    ports:
      - "19401:19401"

  node-2:
    <<: *node
    command: ["stoffel-server", "2"]
    depends_on:
      coordinator:
        condition: service_healthy
      node-0:
        # Peers only need node-0's container to exist (so node-0:19200
        # resolves) and its bootnode process listening. node-0's healthcheck
        # probes its RPC port, which cannot come up until every party has
        # joined the session, so a service_healthy gate here deadlocks startup.
        condition: service_started
    environment:
      <<: *node-env
      STOFFEL_BIND_ADDRESS: node-2:19204
      STOFFEL_RPC_BIND_ADDRESS: 0.0.0.0:19402
      STOFFEL_BOOTSTRAP_ADDRESS: node-0:19200
    ports:
      - "19402:19402"

  node-3:
    <<: *node
    command: ["stoffel-server", "3"]
    depends_on:
      coordinator:
        condition: service_healthy
      node-0:
        # Peers only need node-0's container to exist (so node-0:19200
        # resolves) and its bootnode process listening. node-0's healthcheck
        # probes its RPC port, which cannot come up until every party has
        # joined the session, so a service_healthy gate here deadlocks startup.
        condition: service_started
    environment:
      <<: *node-env
      STOFFEL_BIND_ADDRESS: node-3:19206
      STOFFEL_RPC_BIND_ADDRESS: 0.0.0.0:19403
      STOFFEL_BOOTSTRAP_ADDRESS: node-0:19200
    ports:
      - "19403:19403"

  node-4:
    <<: *node
    command: ["stoffel-server", "4"]
    depends_on:
      coordinator:
        condition: service_healthy
      node-0:
        # Peers only need node-0's container to exist (so node-0:19200
        # resolves) and its bootnode process listening. node-0's healthcheck
        # probes its RPC port, which cannot come up until every party has
        # joined the session, so a service_healthy gate here deadlocks startup.
        condition: service_started
    environment:
      <<: *node-env
      STOFFEL_BIND_ADDRESS: node-4:19208
      STOFFEL_RPC_BIND_ADDRESS: 0.0.0.0:19404
      STOFFEL_BOOTSTRAP_ADDRESS: node-0:19200
    ports:
      - "19404:19404"

  input-ready:
    build:
      context: ..
      dockerfile: scripts/Dockerfile
    command: ["stoffel-coordinator", "wait-ready"]
    environment:
      STOFFEL_COORDINATOR_ADDRESS: coordinator:19300
    volumes:
      - ../deploy/local:/app/deploy/local:ro
    depends_on:
      coordinator:
        condition: service_healthy
      node-0:
        condition: service_healthy
      node-1:
        condition: service_healthy
      node-2:
        condition: service_healthy
      node-3:
        condition: service_healthy
      node-4:
        condition: service_healthy
    restart: "no"

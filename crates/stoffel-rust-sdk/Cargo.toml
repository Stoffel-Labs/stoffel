[package]
name = "stoffel-rust-sdk"
version = "0.1.2"
edition = "2021"
description = "Rust SDK for building Stoffel MPC applications"
license = "Apache-2.0"
repository = "https://github.com/Stoffel-Labs/stoffel"
readme = "README.md"
keywords = ["mpc", "sdk", "compiler", "vm", "cryptography"]
categories = ["api-bindings", "compilers", "cryptography"]
publish = true

[lib]
name = "stoffel"

[dependencies]
ark-bls12-381 = "=0.5.0"
ark-bn254 = "=0.5.0"
ark-curve25519 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ed25519 = "=0.5.0"
ark-ff = "=0.5.0"
ark-secp256k1 = "=0.5.0"
ark-secp256r1 = "=0.5.0"
ark-serialize = { version = "=0.5.0", features = ["ark-serialize-derive"] }
ark-std = { version = "=0.5.0", features = ["getrandom"] }
async-trait = "=0.1.89"
bincode = { version = "=1.3.3", default-features = true }
blake3 = "=1.8.5"
futures = "=0.3.32"
futures-core = "=0.3.32"
csv = "=1.4.0"
hex = "=0.4.3"
opentelemetry = "=0.32.0"
opentelemetry-stdout = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace"] }
rustls = { version = "=0.23.41", default-features = false, features = ["ring"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
stoffelnet = "=0.1.1"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["full"] }
toml = "=0.8.23"
tracing = { version = "=0.1.44", features = ["attributes"] }
tracing-opentelemetry = "=0.33.0"
tracing-subscriber = { version = "=0.3.23", features = ["fmt"] }
uuid = { version = "=1.23.4", features = ["v4"] }

stoffellang = { version = "=0.1.2", path = "../stoffel-lang" }
stoffel-mpc-coordinator-shared = "=0.3.0"
stoffel-mpc-coordinator-off-chain = "=0.3.0"
stoffel-vm = { version = "=0.1.2", path = "../stoffel-vm" }
stoffel-vm-types = { version = "=0.1.2", path = "../stoffel-vm-types" }
stoffelmpc-mpc = { package = "stoffelcrypto", version = "=0.1.1" }

[dev-dependencies]
aes = "=0.8.4"
# The node tests mint certificates (docs/design/bootnode-elimination.md §9.H).
rcgen = "=0.14.8"
stoffel-bindgen = { version = "=0.1.2", path = "../stoffel-bindgen" }
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread"] }
trybuild = "=1.0.117"

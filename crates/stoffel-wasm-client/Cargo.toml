[package]
name = "stoffel-wasm-client"
version = "0.1.0"
edition = "2021"
description = "Browser-side private client I/O for the Stoffel coordinator"
license = "Apache-2.0"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ark-bls12-381 = "0.5.0"
ark-ff = "0.5.0"
ark-poly = "0.5.0"
ark-serialize = { version = "0.5.0", features = ["derive"] }
console_error_panic_hook = "0.1.7"
# Unconditional (not wasm32-gated): needed by `random_nonce` for the request-
# signing nonce, which must also be callable from native `cargo test`. The
# "js" feature only takes effect on wasm32 (browser `crypto.getRandomValues`);
# native targets get getrandom's normal OS random source regardless.
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
hpke = "0.13.0"
js-sys = "0.3.81"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
sha2 = "0.10.8"
stoffel-vm-types = { version = "0.1.1", path = "../stoffel-vm-types" }
thiserror = "2"
wasm-bindgen = "0.2.104"

[dev-dependencies]
rand = "0.9"
stoffelmpc-mpc = { package = "stoffelcrypto", version = "0.1.1" }

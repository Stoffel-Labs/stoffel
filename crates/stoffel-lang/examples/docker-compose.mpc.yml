# Distributed VM runner for compiled examples in examples/dist.
#
# Usage:
#   STOFFEL_PROGRAM_NAME=mpc_runtime_info.stflb \
#     docker compose -f examples/docker-compose.mpc.yml up --build
#
# For threshold ECDSA:
#   STOFFEL_PROGRAM_NAME=threshold_signatures_threshold_ecdsa_secp256k1.stflb \
#   STOFFEL_MPC_BACKEND=avss \
#   STOFFEL_MPC_CURVE=secp256k1 \
#     docker compose -f examples/docker-compose.mpc.yml up --build
#
# Every stack runs a coordinator (docs/design/bootnode-elimination.md §9.F.1):
# it is the only roster authority, and it registers the execution — the
# program the parties run and any client slots. This stack runs no client
# service and its default programs use no client, so by default no client slot
# is registered; a program that uses ClientStore only when clients exist
# (mpc_share_arithmetic) runs with the empty slot table. Coordinator-mediated
# clients are exercised by docker-compose.coordinator.yml.

# Certificates are public, and each is mounted read-only as its own file, only
# into the services that read it (docs/design/bootnode-elimination.md §9.F.0): the
# coordinator gets the node certificates (the roster it serves) and the
# client certificates a pre-registered run names; a party gets the
# coordinator's certificate, which it pins, and its own; a client the same.
# No party holds another node's certificate or any client's: membership is the
# roster the coordinator serves, and clients are admitted by the coordinator,
# never listed on a node. Private keys are never baked into an image or mounted
# as a directory: each service receives exactly its own key as a compose
# secret. The keys under ids/ are committed development fixtures, which is why
# every published port is bound to 127.0.0.1 only.
x-coordinator-pin: &coordinator-pin
  source: coordinator_cert
  target: /app/ids/server_cert.crt

x-coordinator-certificates: &coordinator-certificates
  - *coordinator-pin
  - source: node0_cert
    target: /app/ids/nodes/cert0.crt
  - source: node1_cert
    target: /app/ids/nodes/cert1.crt
  - source: node2_cert
    target: /app/ids/nodes/cert2.crt
  - source: node3_cert
    target: /app/ids/nodes/cert3.crt
  - source: node4_cert
    target: /app/ids/nodes/cert4.crt
  - source: client0_cert
    target: /app/ids/clients/cert0.crt
  - source: client1_cert
    target: /app/ids/clients/cert1.crt

x-stoffel-build: &stoffel-build
  context: ${STOFFEL_VM_DIR:-../../..}
  dockerfile: Dockerfile
  additional_contexts:
    coordinator: "${STOFFEL_COORDINATOR_CONTEXT:?set STOFFEL_COORDINATOR_CONTEXT to the stoffel-mpc-coordinator 0.3.0 checkout until it is published}"

x-party-common: &party-common
  build: *stoffel-build
  volumes:
    - ${STOFFEL_EXAMPLES_OUT:-./dist}:/app/examples:ro
    - stoffel-local-store:/app/local-store
  networks:
    stoffel-examples:
  environment: &party-env
    STOFFEL_PROGRAM: /app/examples/${STOFFEL_PROGRAM_NAME:-mpc_runtime_info.stflb}
    STOFFEL_ENTRY: ${STOFFEL_ENTRY:-main}
    STOFFEL_MPC_BACKEND: ${STOFFEL_MPC_BACKEND:-honeybadger}
    STOFFEL_MPC_CURVE: ${STOFFEL_MPC_CURVE:-bls12-381}
    STOFFEL_LOCAL_STORE: /app/local-store/party-${STOFFEL_PARTY_ID:-0}.redb
    # The coordinator every party pins (--coord-cert) and the invocation it
    # serves. Membership is the node roster the coordinator serves
    # (docs/design/bootnode-elimination.md §9.D): each party fetches it once
    # over this pinned connection, before it binds anything, and installs its
    # certificates as the transport's peer-certificate allowlist, so membership
    # is enforced per connection by mTLS. No party carries a roster, a party
    # count or a threshold of its own.
    STOFFEL_COORD_ADDR: 172.29.0.5:31415
    STOFFEL_COORD_CERT: /app/ids/server_cert.crt
    STOFFEL_EXECUTION_ID: "${STOFFEL_EXECUTION_ID:-2222222222222222222222222222222222222222222222222222222222222222}"
    # Optional: refuse a coordinator that serves any other node roster.
    STOFFEL_EXPECT_ROSTER_DIGEST: ${STOFFEL_EXPECT_ROSTER_DIGEST-}
    # Mesh seeds (docs/design/bootnode-elimination.md): every party below dials
    # the other four addresses in STOFFEL_PEERS, pinned to that roster.
    # Every party, party0 included, binds and advertises 9000.
    # STOFFEL_EPOCH_STORE keeps that party's monotone session epoch on the same
    # named volume as its local store, which is what makes instance_id fresh
    # across runs of this fixed roster (blocker B5).
    RUST_LOG: ${RUST_LOG:-info}
    RUST_BACKTRACE: "1"

services:
  # The roster authority and the only place a client is admitted (§9.F.1).
  coordinator:
    configs: *coordinator-certificates
    secrets:
      - coordinator_key
    build:
      context: ${STOFFEL_VM_DIR:-../../..}
      dockerfile: docker/coordinator.Dockerfile
      additional_contexts:
        coordinator: "${STOFFEL_COORDINATOR_CONTEXT:?set STOFFEL_COORDINATOR_CONTEXT to the stoffel-mpc-coordinator 0.3.0 checkout until it is published}"
    hostname: coordinator
    volumes:
      - ${STOFFEL_EXAMPLES_OUT:-./dist}:/app/examples:ro
    command:
      - --bind-addr
      - 0.0.0.0
      - --port
      - "31415"
      # The program this execution is registered for: the wrapper hashes these
      # bytes, and every party refuses a summary naming another program than
      # the one it loaded (§9.D.7 step 1). Must be the parties' STOFFEL_PROGRAM.
      - --program
      - "/app/examples/${STOFFEL_PROGRAM_NAME:-mpc_runtime_info.stflb}"
      # The invocation every party of this stack joins. The coordinator is a
      # fresh process per `docker compose up`, so a constant is fine.
      - --execution-id
      - "${STOFFEL_EXECUTION_ID:-2222222222222222222222222222222222222222222222222222222222222222}"
      - --server-cert
      - /app/ids/server_cert.crt
      - --server-key
      - /run/secrets/coordinator_key
      # The node roster is these certificates, n is their number, and t is the
      # one threshold of the stack (compose substitutes it from the invoking
      # shell; it never reaches a party).
      - --node-certs
      - /app/ids/nodes/cert0.crt,/app/ids/nodes/cert1.crt,/app/ids/nodes/cert2.crt,/app/ids/nodes/cert3.crt,/app/ids/nodes/cert4.crt
      - --t
      - "${STOFFEL_THRESHOLD:-1}"
      - --client-io
      - "${STOFFEL_CLIENT_IO-}"
      - --client-certs
      - "${STOFFEL_CLIENT_CERTS-}"
      # How clients are admitted to the slots (§9.C.2, §9.F.3): pre-registered
      # (the default) binds STOFFEL_CLIENT_CERTS to the slots in order; open
      # names no client, so any certificate holder that pins this coordinator
      # may bind a free slot; invitation admits holders of an invitation that
      # STOFFEL_INVITATION_ISSUER_CERT's key signed (mount that certificate
      # into this service). Open and invitation need both deadlines, in seconds
      # after the coordinator starts. An empty value is an absent flag, and a
      # flag the chosen admission does not read makes the coordinator exit 2.
      - --admission
      - "${STOFFEL_ADMISSION:-pre-registered}"
      - --invitation-issuer-cert
      - "${STOFFEL_INVITATION_ISSUER_CERT-}"
      - --association-deadline-secs
      - "${STOFFEL_ASSOCIATION_DEADLINE_SECS-}"
      - --input-deadline-secs
      - "${STOFFEL_INPUT_DEADLINE_SECS-}"
    networks:
      stoffel-examples:
        ipv4_address: 172.29.0.5
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep -q ':31415' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  party0:
    configs:
      - *coordinator-pin
      - source: node0_cert
        target: /app/ids/nodes/cert0.crt
    secrets:
      - node0_key
    <<: *party-common
    hostname: party0
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      <<: *party-env
      STOFFEL_ROLE: leader
      STOFFEL_PARTY_ID: "0"
      STOFFEL_BIND_ADDR: 172.29.0.10:9000
      STOFFEL_ADVERTISE_IP: 172.29.0.10
      STOFFEL_LOCAL_STORE: /app/local-store/party-0.redb
      STOFFEL_EPOCH_STORE: /app/local-store/epochs-party-0
      STOFFEL_PEERS: ${STOFFEL_PEERS-172.29.0.11:9001,172.29.0.12:9002,172.29.0.13:9003,172.29.0.14:9004}
      STOFFEL_CERT: /app/ids/nodes/cert0.crt
      STOFFEL_KEY: /run/secrets/node0_key
      STOFFEL_RPC_ADDR: 172.29.0.10:16180
    networks:
      stoffel-examples:
        ipv4_address: 172.29.0.10

  party1:
    configs:
      - *coordinator-pin
      - source: node1_cert
        target: /app/ids/nodes/cert1.crt
    secrets:
      - node1_key
    <<: *party-common
    hostname: party1
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_started
    environment:
      <<: *party-env
      STOFFEL_ROLE: party
      STOFFEL_PARTY_ID: "1"
      STOFFEL_BIND_ADDR: 172.29.0.11:9001
      STOFFEL_ADVERTISE_IP: 172.29.0.11
      STOFFEL_LOCAL_STORE: /app/local-store/party-1.redb
      STOFFEL_EPOCH_STORE: /app/local-store/epochs-party-1
      STOFFEL_PEERS: ${STOFFEL_PEERS-172.29.0.10:9000,172.29.0.12:9002,172.29.0.13:9003,172.29.0.14:9004}
      STOFFEL_CERT: /app/ids/nodes/cert1.crt
      STOFFEL_KEY: /run/secrets/node1_key
      STOFFEL_RPC_ADDR: 172.29.0.11:16181
    networks:
      stoffel-examples:
        ipv4_address: 172.29.0.11

  party2:
    configs:
      - *coordinator-pin
      - source: node2_cert
        target: /app/ids/nodes/cert2.crt
    secrets:
      - node2_key
    <<: *party-common
    hostname: party2
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_started
    environment:
      <<: *party-env
      STOFFEL_ROLE: party
      STOFFEL_PARTY_ID: "2"
      STOFFEL_BIND_ADDR: 172.29.0.12:9002
      STOFFEL_ADVERTISE_IP: 172.29.0.12
      STOFFEL_LOCAL_STORE: /app/local-store/party-2.redb
      STOFFEL_EPOCH_STORE: /app/local-store/epochs-party-2
      STOFFEL_PEERS: ${STOFFEL_PEERS-172.29.0.10:9000,172.29.0.11:9001,172.29.0.13:9003,172.29.0.14:9004}
      STOFFEL_CERT: /app/ids/nodes/cert2.crt
      STOFFEL_KEY: /run/secrets/node2_key
      STOFFEL_RPC_ADDR: 172.29.0.12:16182
    networks:
      stoffel-examples:
        ipv4_address: 172.29.0.12

  party3:
    configs:
      - *coordinator-pin
      - source: node3_cert
        target: /app/ids/nodes/cert3.crt
    secrets:
      - node3_key
    <<: *party-common
    hostname: party3
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_started
    environment:
      <<: *party-env
      STOFFEL_ROLE: party
      STOFFEL_PARTY_ID: "3"
      STOFFEL_BIND_ADDR: 172.29.0.13:9003
      STOFFEL_ADVERTISE_IP: 172.29.0.13
      STOFFEL_LOCAL_STORE: /app/local-store/party-3.redb
      STOFFEL_EPOCH_STORE: /app/local-store/epochs-party-3
      STOFFEL_PEERS: ${STOFFEL_PEERS-172.29.0.10:9000,172.29.0.11:9001,172.29.0.12:9002,172.29.0.14:9004}
      STOFFEL_CERT: /app/ids/nodes/cert3.crt
      STOFFEL_KEY: /run/secrets/node3_key
      STOFFEL_RPC_ADDR: 172.29.0.13:16183
    networks:
      stoffel-examples:
        ipv4_address: 172.29.0.13

  party4:
    configs:
      - *coordinator-pin
      - source: node4_cert
        target: /app/ids/nodes/cert4.crt
    secrets:
      - node4_key
    <<: *party-common
    hostname: party4
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_started
    environment:
      <<: *party-env
      STOFFEL_ROLE: party
      STOFFEL_PARTY_ID: "4"
      STOFFEL_BIND_ADDR: 172.29.0.14:9004
      STOFFEL_ADVERTISE_IP: 172.29.0.14
      STOFFEL_LOCAL_STORE: /app/local-store/party-4.redb
      STOFFEL_EPOCH_STORE: /app/local-store/epochs-party-4
      STOFFEL_PEERS: ${STOFFEL_PEERS-172.29.0.10:9000,172.29.0.11:9001,172.29.0.12:9002,172.29.0.13:9003}
      STOFFEL_CERT: /app/ids/nodes/cert4.crt
      STOFFEL_KEY: /run/secrets/node4_key
      STOFFEL_RPC_ADDR: 172.29.0.14:16184
    networks:
      stoffel-examples:
        ipv4_address: 172.29.0.14

networks:
  stoffel-examples:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  stoffel-local-store:

configs:
  coordinator_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/server_cert.crt
  node0_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/cert0.crt
  node1_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/cert1.crt
  node2_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/cert2.crt
  node3_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/cert3.crt
  node4_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/cert4.crt
  client0_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/clients/cert0.crt
  client1_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/clients/cert1.crt

secrets:
  coordinator_key:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/server_key.der
  node0_key:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/key0.der
  node1_key:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/key1.der
  node2_key:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/key2.der
  node3_key:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/key3.der
  node4_key:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/key4.der

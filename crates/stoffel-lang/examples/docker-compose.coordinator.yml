# Coordinator-backed example validation.
#
# This mirrors StoffelVM's docker-compose.coordinator.reserve-index.yml, but
# mounts compiled example binaries from examples/dist instead of using the VM's
# baked-in test fixtures, and registers its client slots under pre-registered
# admission by default: the coordinator binds client 0's and client 1's
# certificates to slots 0 and 1 (STOFFEL_CLIENT_CERTS). No party is told either
# certificate. STOFFEL_ADMISSION=open, with both deadline variables and an
# empty STOFFEL_CLIENT_CERTS, runs the same example with clients nobody named in
# advance.

# Certificates are public, and each is mounted read-only as its own file, only
# into the services that read it (docs/design/bootnode-elimination.md §9.F.0): the
# coordinator gets the node certificates (the roster it serves) and the
# client certificates a pre-registered run names; a party gets the
# coordinator's certificate, which it pins, and its own; a client the same.
# No party holds another node's certificate or any client's: membership is the
# roster the coordinator serves, and clients are admitted by the coordinator,
# never listed on a node. Private keys are never baked into an image or mounted
# as a directory: each service receives exactly its own key as a compose
# secret. The keys under ids/ are committed development fixtures, which is why
# every published port is bound to 127.0.0.1 only.
x-coordinator-pin: &coordinator-pin
  source: coordinator_cert
  target: /app/ids/server_cert.crt

x-coordinator-certificates: &coordinator-certificates
  - *coordinator-pin
  - source: node0_cert
    target: /app/ids/nodes/cert0.crt
  - source: node1_cert
    target: /app/ids/nodes/cert1.crt
  - source: node2_cert
    target: /app/ids/nodes/cert2.crt
  - source: node3_cert
    target: /app/ids/nodes/cert3.crt
  - source: node4_cert
    target: /app/ids/nodes/cert4.crt
  - source: client0_cert
    target: /app/ids/clients/cert0.crt
  - source: client1_cert
    target: /app/ids/clients/cert1.crt

x-stoffel-build: &stoffel-build
  context: ${STOFFEL_VM_DIR:-../../..}
  dockerfile: Dockerfile
  additional_contexts:
    coordinator: "${STOFFEL_COORDINATOR_CONTEXT:?set STOFFEL_COORDINATOR_CONTEXT to the stoffel-mpc-coordinator 0.3.0 checkout until it is published}"

x-party-common: &party-common
  build: *stoffel-build
  volumes:
    - ${STOFFEL_EXAMPLES_OUT:-./dist}:/app/examples:ro
    # One named volume, one subdirectory per party (STOFFEL_EPOCH_STORE below):
    # the monotone session epoch has to survive `docker compose down`, or the
    # next run reuses the previous run's MPC session namespace (blocker B5).
    - stoffel-examples-coord-epochs:/app/epochs
  environment: &party-env
    STOFFEL_PROGRAM: /app/examples/${STOFFEL_PROGRAM_NAME:-mpc_share_arithmetic.stflb}
    STOFFEL_ENTRY: ${STOFFEL_ENTRY:-main}
    STOFFEL_MPC_BACKEND: honeybadger
    STOFFEL_MPC_CURVE: bls12-381
    STOFFEL_COORD_ADDR: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.5:31415
    STOFFEL_COORD_CERT: /app/ids/server_cert.crt
    # The invocation this container joins. The coordinator keys every RPC on
    # it, so it must match the coordinator service's --execution-id and be
    # the same for every party and client of one run.
    STOFFEL_EXECUTION_ID: "${STOFFEL_EXECUTION_ID:-2222222222222222222222222222222222222222222222222222222222222222}"
    # Membership is the coordinator's node roster
    # (docs/design/bootnode-elimination.md §9.D): each party fetches it once
    # over the connection STOFFEL_COORD_CERT pins, before it binds anything, and
    # installs its certificates as the transport's peer-certificate allowlist,
    # so membership is enforced per connection by mTLS. No party carries a
    # roster, a party count or a threshold of its own; the entrypoint refuses
    # STOFFEL_NODE_ROSTER, STOFFEL_N_PARTIES and STOFFEL_THRESHOLD by name.
    #
    # No client certificate, count or slot is given to a party (decision 3 of
    # docs/design/bootnode-elimination.md §9): which clients take part, and
    # with how many inputs, is the coordinator's registration (--client-io and
    # --client-certs on the coordinator service), and the clients reach the
    # parties' RPC listeners, never the mesh. stoffel-run refuses
    # STOFFEL_EXPECTED_CLIENTS and STOFFEL_CLIENT_INPUT_COUNT alongside a
    # coordinator.
    # Mesh seeds (docs/design/bootnode-elimination.md): every party below dials
    # the other four addresses in STOFFEL_PEERS, pinned to that roster.
    # Every party, party0 included, binds and advertises 9000. None of them
    # drives the coordinator's rounds: the coordinator applies a round once a
    # quorum of roster members has proposed it, so STOFFEL_ROLE=leader on
    # party0 is only a label.
    #
    # STOFFEL_PEERS is written out per party rather than as ${STOFFEL_PEERS-...}
    # because the addresses are built from STOFFEL_COORD_NET_PREFIX and Compose
    # does not nest substitutions.
    STOFFEL_EXPECT_ROSTER_DIGEST: ${STOFFEL_EXPECT_ROSTER_DIGEST-}
    RUST_LOG: ${RUST_LOG:-info}
    RUST_BACKTRACE: "1"
  networks:
    stoffel-examples-coord-net: {}

x-client-common: &client-common
  build: *stoffel-build
  environment: &client-env
    STOFFEL_ROLE: client
    STOFFEL_SERVERS: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.10:16180,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.11:16181,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.12:16182,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.13:16183,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.14:16184
    STOFFEL_MPC_BACKEND: honeybadger
    STOFFEL_MPC_CURVE: bls12-381
    STOFFEL_COORD_ADDR: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.5:31415
    STOFFEL_COORD_CERT: /app/ids/server_cert.crt
    # The invocation this container joins. The coordinator keys every RPC on
    # it, so it must match the coordinator service's --execution-id and be
    # the same for every party and client of one run.
    STOFFEL_EXECUTION_ID: "${STOFFEL_EXECUTION_ID:-2222222222222222222222222222222222222222222222222222222222222222}"
    # No input index, output count or slot layout is set on a client: its
    # input range and output count are the admission the coordinator gives it
    # when it associates (docs/design/bootnode-elimination.md §9.E), and the
    # entrypoint refuses STOFFEL_CLIENT_INDEX and STOFFEL_OUTPUTS by name.
    # STOFFEL_CLIENT_SLOT asks for a specific slot.
    STOFFEL_OUTPUT_FIXED_POINT_FRACTIONAL_BITS: ${STOFFEL_OUTPUT_FIXED_POINT_FRACTIONAL_BITS:-}
    # No roster is set on this client, or on any container: the client's node
    # legs are pinned to the node roster the pinned coordinator serves
    # (docs/design/bootnode-elimination.md §9.E.1), and stoffel-run refuses
    # --roster by name.
    STOFFEL_EXPECT_ROSTER_DIGEST: ${STOFFEL_EXPECT_ROSTER_DIGEST-}
    STOFFEL_CLIENT_DELAY: ${STOFFEL_CLIENT_DELAY:-20}
    RUST_LOG: ${RUST_LOG:-info}
    RUST_BACKTRACE: "1"
  networks:
    stoffel-examples-coord-net: {}

services:
  coordinator:
    configs: *coordinator-certificates
    secrets:
      - coordinator_key
    build:
      context: ${STOFFEL_VM_DIR:-../../..}
      dockerfile: docker/coordinator.Dockerfile
      additional_contexts:
        coordinator: "${STOFFEL_COORDINATOR_CONTEXT:?set STOFFEL_COORDINATOR_CONTEXT to the stoffel-mpc-coordinator 0.3.0 checkout until it is published}"
    container_name: stoffel-examples-coordinator
    hostname: coordinator
    volumes:
      - ${STOFFEL_EXAMPLES_OUT:-./dist}:/app/examples:ro
    command:
      - --bind-addr
      - 0.0.0.0
      - --port
      - "31415"
      # The program this execution is registered for: the wrapper hashes these
      # bytes, and every party refuses a summary naming another program than
      # the one it loaded (docs/design/bootnode-elimination.md §9.D.7 step 1,
      # §9.F.1). Must be the parties' STOFFEL_PROGRAM.
      - --program
      - "/app/examples/${STOFFEL_PROGRAM_NAME:-mpc_share_arithmetic.stflb}"
      # The invocation every party and client of this stack joins. The
      # coordinator keys rounds, admissions, masked inputs and output shares
      # on it. This coordinator is a fresh process per `docker compose up`,
      # which registers the execution anew, so a constant is fine; a standing
      # coordinator needs a new value per run.
      - --execution-id
      - "${STOFFEL_EXECUTION_ID:-2222222222222222222222222222222222222222222222222222222222222222}"
      - --server-cert
      - /app/ids/server_cert.crt
      - --server-key
      - /run/secrets/coordinator_key
      # The node roster is these certificates and n is their number. Every
      # client slot is registered up front, one `<inputs>:<outputs>` entry per
      # slot; the default is mpc_share_arithmetic's (one input and one output
      # for client 0, one input for client 1). Under pre-registered admission
      # STOFFEL_CLIENT_CERTS names, in the same order, the certificate bound
      # to each slot.
      - --node-certs
      - /app/ids/nodes/cert0.crt,/app/ids/nodes/cert1.crt,/app/ids/nodes/cert2.crt,/app/ids/nodes/cert3.crt,/app/ids/nodes/cert4.crt
      - --t
      - "1"
      - --client-io
      - "${STOFFEL_CLIENT_IO-1:1,1:0}"
      - --client-certs
      - "${STOFFEL_CLIENT_CERTS-/app/ids/clients/cert0.crt,/app/ids/clients/cert1.crt}"
      # How clients are admitted to the slots (§9.C.2, §9.F.3): pre-registered
      # (the default) binds STOFFEL_CLIENT_CERTS to the slots in order; open
      # names no client, so any certificate holder that pins this coordinator
      # may bind a free slot; invitation admits holders of an invitation that
      # STOFFEL_INVITATION_ISSUER_CERT's key signed (mount that certificate
      # into this service). Open and invitation need both deadlines, in seconds
      # after the coordinator starts. An empty value is an absent flag, and a
      # flag the chosen admission does not read makes the coordinator exit 2.
      - --admission
      - "${STOFFEL_ADMISSION:-pre-registered}"
      - --invitation-issuer-cert
      - "${STOFFEL_INVITATION_ISSUER_CERT-}"
      - --association-deadline-secs
      - "${STOFFEL_ASSOCIATION_DEADLINE_SECS-}"
      - --input-deadline-secs
      - "${STOFFEL_INPUT_DEADLINE_SECS-}"
    networks:
      stoffel-examples-coord-net:
        ipv4_address: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.5
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep -q ':31415' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  party0:
    configs:
      - *coordinator-pin
      - source: node0_cert
        target: /app/ids/nodes/cert0.crt
    secrets:
      - node0_key
    <<: *party-common
    container_name: stoffel-examples-coord-party0
    hostname: party0
    environment:
      <<: *party-env
      STOFFEL_ROLE: leader
      STOFFEL_PARTY_ID: "0"
      STOFFEL_BIND_ADDR: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.10:9000
      STOFFEL_RPC_ADDR: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.10:16180
      STOFFEL_CERT: /app/ids/nodes/cert0.crt
      STOFFEL_KEY: /run/secrets/node0_key
      STOFFEL_PEERS: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.11:9001,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.12:9002,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.13:9003,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.14:9004
      STOFFEL_EPOCH_STORE: /app/epochs/party-0
    networks:
      stoffel-examples-coord-net:
        ipv4_address: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.10
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep -q ':9000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  party1:
    configs:
      - *coordinator-pin
      - source: node1_cert
        target: /app/ids/nodes/cert1.crt
    secrets:
      - node1_key
    <<: *party-common
    container_name: stoffel-examples-coord-party1
    hostname: party1
    environment:
      <<: *party-env
      STOFFEL_ROLE: party
      STOFFEL_PARTY_ID: "1"
      STOFFEL_BIND_ADDR: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.11:9001
      STOFFEL_RPC_ADDR: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.11:16181
      STOFFEL_CERT: /app/ids/nodes/cert1.crt
      STOFFEL_KEY: /run/secrets/node1_key
      STOFFEL_PEERS: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.10:9000,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.12:9002,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.13:9003,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.14:9004
      STOFFEL_EPOCH_STORE: /app/epochs/party-1
    networks:
      stoffel-examples-coord-net:
        ipv4_address: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.11
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_healthy

  party2:
    configs:
      - *coordinator-pin
      - source: node2_cert
        target: /app/ids/nodes/cert2.crt
    secrets:
      - node2_key
    <<: *party-common
    container_name: stoffel-examples-coord-party2
    hostname: party2
    environment:
      <<: *party-env
      STOFFEL_ROLE: party
      STOFFEL_PARTY_ID: "2"
      STOFFEL_BIND_ADDR: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.12:9002
      STOFFEL_RPC_ADDR: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.12:16182
      STOFFEL_CERT: /app/ids/nodes/cert2.crt
      STOFFEL_KEY: /run/secrets/node2_key
      STOFFEL_PEERS: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.10:9000,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.11:9001,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.13:9003,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.14:9004
      STOFFEL_EPOCH_STORE: /app/epochs/party-2
    networks:
      stoffel-examples-coord-net:
        ipv4_address: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.12
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_healthy

  party3:
    configs:
      - *coordinator-pin
      - source: node3_cert
        target: /app/ids/nodes/cert3.crt
    secrets:
      - node3_key
    <<: *party-common
    container_name: stoffel-examples-coord-party3
    hostname: party3
    environment:
      <<: *party-env
      STOFFEL_ROLE: party
      STOFFEL_PARTY_ID: "3"
      STOFFEL_BIND_ADDR: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.13:9003
      STOFFEL_RPC_ADDR: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.13:16183
      STOFFEL_CERT: /app/ids/nodes/cert3.crt
      STOFFEL_KEY: /run/secrets/node3_key
      STOFFEL_PEERS: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.10:9000,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.11:9001,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.12:9002,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.14:9004
      STOFFEL_EPOCH_STORE: /app/epochs/party-3
    networks:
      stoffel-examples-coord-net:
        ipv4_address: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.13
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_healthy

  party4:
    configs:
      - *coordinator-pin
      - source: node4_cert
        target: /app/ids/nodes/cert4.crt
    secrets:
      - node4_key
    <<: *party-common
    container_name: stoffel-examples-coord-party4
    hostname: party4
    environment:
      <<: *party-env
      STOFFEL_ROLE: party
      STOFFEL_PARTY_ID: "4"
      STOFFEL_BIND_ADDR: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.14:9004
      STOFFEL_RPC_ADDR: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.14:16184
      STOFFEL_CERT: /app/ids/nodes/cert4.crt
      STOFFEL_KEY: /run/secrets/node4_key
      STOFFEL_PEERS: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.10:9000,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.11:9001,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.12:9002,${STOFFEL_COORD_NET_PREFIX:-172.32.0}.13:9003
      STOFFEL_EPOCH_STORE: /app/epochs/party-4
    networks:
      stoffel-examples-coord-net:
        ipv4_address: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.14
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_healthy

  client0:
    configs:
      - *coordinator-pin
      - source: client0_cert
        target: /app/ids/clients/cert0.crt
    secrets:
      - client0_key
    <<: *client-common
    container_name: stoffel-examples-coord-client0
    hostname: client0
    environment:
      <<: *client-env
      STOFFEL_INPUTS: ${STOFFEL_CLIENT0_INPUT:-15}
      STOFFEL_CLIENT_SLOT: ${STOFFEL_CLIENT0_SLOT:-0}
      STOFFEL_CERT: /app/ids/clients/cert0.crt
      STOFFEL_KEY: /run/secrets/client0_key
    networks:
      stoffel-examples-coord-net:
        ipv4_address: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.100
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_healthy
      party1:
        condition: service_started
      party2:
        condition: service_started
      party3:
        condition: service_started
      party4:
        condition: service_started

  client1:
    configs:
      - *coordinator-pin
      - source: client1_cert
        target: /app/ids/clients/cert1.crt
    secrets:
      - client1_key
    <<: *client-common
    container_name: stoffel-examples-coord-client1
    hostname: client1
    environment:
      <<: *client-env
      STOFFEL_INPUTS: ${STOFFEL_CLIENT1_INPUT:-25}
      STOFFEL_CLIENT_SLOT: ${STOFFEL_CLIENT1_SLOT:-1}
      STOFFEL_CERT: /app/ids/clients/cert1.crt
      STOFFEL_KEY: /run/secrets/client1_key
    networks:
      stoffel-examples-coord-net:
        ipv4_address: ${STOFFEL_COORD_NET_PREFIX:-172.32.0}.101
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_healthy
      party1:
        condition: service_started
      party2:
        condition: service_started
      party3:
        condition: service_started
      party4:
        condition: service_started

networks:
  stoffel-examples-coord-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${STOFFEL_COORD_SUBNET:-172.32.0.0/24}

volumes:
  stoffel-examples-coord-epochs:

configs:
  coordinator_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/server_cert.crt
  node0_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/cert0.crt
  node1_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/cert1.crt
  node2_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/cert2.crt
  node3_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/cert3.crt
  node4_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/cert4.crt
  client0_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/clients/cert0.crt
  client1_cert:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/clients/cert1.crt

secrets:
  client0_key:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/clients/key0.der
  client1_key:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/clients/key1.der
  coordinator_key:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/server_key.der
  node0_key:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/key0.der
  node1_key:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/key1.der
  node2_key:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/key2.der
  node3_key:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/key3.der
  node4_key:
    file: ${STOFFEL_VM_DIR:-../../..}/ids/nodes/key4.der

# StoffelVM 5-node HoneyBadger MPC run, fully symmetric.
#
# This is docker-compose.yml's stack with every party spelled the same way:
# five node services that fetch the node roster from the coordinator once,
# over the connection STOFFEL_COORD_CERT pins, dial each other from
# STOFFEL_PEERS seed addresses and admit only roster members
# (docs/design/bootnode-elimination.md §9.D). No party is special, not even by
# role: the coordinator is the only trusted party, and it holds membership and
# admission, not a party.
#
# Usage:
#   docker compose -f docker-compose.mesh.yml up --build
#
# Differences from docker-compose.yml:
#
#   * every party service is STOFFEL_ROLE=party, including party0, because
#     nothing distinguishes one party from another: coordinator rounds are
#     quorum-gated, so every party proposes every transition;
#   * every party keeps its own epoch store on the shared named volume, which is
#     what makes instance_id fresh across runs of this fixed roster (blocker
#     B5). `docker compose -f docker-compose.mesh.yml down` without `-v`
#     preserves it; wiping the volume resets the epoch to 0 and the next run
#     reuses the previous run's MPC session namespace.
#
# Clients are docker-compose.yml's: no party is given a client identity
# (decision 3 of docs/design/bootnode-elimination.md §9), the slots are
# registered with the coordinator alone, and the two client services start only
# with `--profile clients`:
#
#   STOFFEL_PROGRAM=/app/programs/client_mul.stflb STOFFEL_CLIENT_IO=1:0,1:0 \
#   STOFFEL_CLIENT_CERTS=/app/ids/clients/cert0.crt,/app/ids/clients/cert1.crt \
#     docker compose -f docker-compose.mesh.yml --profile clients up --build
#
# or, for clients nobody named in advance, the same slots under
# STOFFEL_ADMISSION=open with STOFFEL_ASSOCIATION_DEADLINE_SECS and
# STOFFEL_INPUT_DEADLINE_SECS set and no STOFFEL_CLIENT_CERTS.
#
# Membership is the coordinator's roster and nothing else: the shared bearer
# token this stack used to carry was deleted with the bootnode, and the
# entrypoint refuses STOFFEL_AUTH_TOKEN by name.

# Certificates are public, and each is mounted read-only as its own file, only
# into the services that read it (docs/design/bootnode-elimination.md §9.F.0): the
# coordinator gets the node certificates (the roster it serves) and the
# client certificates a pre-registered run names; a party gets the
# coordinator's certificate, which it pins, and its own; a client the same.
# No party holds another node's certificate or any client's: membership is the
# roster the coordinator serves, and clients are admitted by the coordinator,
# never listed on a node. Private keys are never baked into an image or mounted
# as a directory: each service receives exactly its own key as a compose
# secret. The keys under ids/ are committed development fixtures, which is why
# every published port is bound to 127.0.0.1 only.
x-coordinator-pin: &coordinator-pin
  source: coordinator_cert
  target: /app/ids/server_cert.crt

x-coordinator-certificates: &coordinator-certificates
  - *coordinator-pin
  - source: node0_cert
    target: /app/ids/nodes/cert0.crt
  - source: node1_cert
    target: /app/ids/nodes/cert1.crt
  - source: node2_cert
    target: /app/ids/nodes/cert2.crt
  - source: node3_cert
    target: /app/ids/nodes/cert3.crt
  - source: node4_cert
    target: /app/ids/nodes/cert4.crt
  - source: client0_cert
    target: /app/ids/clients/cert0.crt
  - source: client1_cert
    target: /app/ids/clients/cert1.crt

x-party-common: &party-common
  build:
    context: .
    dockerfile: Dockerfile
    # TEMPORARY (§9.F.5): the unpublished coordinator 0.3.0, copied to the
    # [patch.crates-io] path. Delete with the patch.
    additional_contexts:
      coordinator: "${STOFFEL_COORDINATOR_CONTEXT:?set STOFFEL_COORDINATOR_CONTEXT to the stoffel-mpc-coordinator 0.3.0 checkout until it is published}"
  networks:
    stoffel-mesh-net:
  volumes:
    - stoffel-mesh-store:/app/mesh-store
  environment: &party-env
    STOFFEL_ROLE: party
    STOFFEL_PROGRAM: ${STOFFEL_PROGRAM:-/app/programs/mpc_aes128_circuit.stflb}
    STOFFEL_ENTRY: ${STOFFEL_ENTRY:-main}
    STOFFEL_MPC_BACKEND: ${STOFFEL_MPC_BACKEND:-honeybadger}
    STOFFEL_MPC_CURVE: ${STOFFEL_MPC_CURVE:-bls12-381}
    # Membership is the coordinator's node roster (§9.D), fetched once by every
    # party: its five certificates are the transport's peer-certificate
    # allowlist, and no client certificate joins them (see the header);
    # party indices are derived from their sorted SPKIs, not from
    # STOFFEL_PARTY_ID, which survives only as the label on this stack's
    # per-party volumes (the store itself is keyed by each node's certificate).
    STOFFEL_EXPECT_ROSTER_DIGEST: ${STOFFEL_EXPECT_ROSTER_DIGEST-}
    RUST_MIN_STACK: ${RUST_MIN_STACK:-67108864}
    RUST_LOG: ${RUST_LOG:-info}
    RUST_BACKTRACE: "1"

x-client-common: &client-common
  build:
    context: .
    dockerfile: Dockerfile
    # TEMPORARY (§9.F.5): see the party build.
    additional_contexts:
      coordinator: "${STOFFEL_COORDINATOR_CONTEXT:?set STOFFEL_COORDINATOR_CONTEXT to the stoffel-mpc-coordinator 0.3.0 checkout until it is published}"
  networks:
    stoffel-mesh-net:
  environment: &client-env
    STOFFEL_ROLE: client
    # The parties' node RPC listeners (their STOFFEL_RPC_ADDR). The client
    # reaches them, never the mesh, and pins every leg to the node roster the
    # coordinator serves (docs/design/bootnode-elimination.md §9.E.1).
    STOFFEL_SERVERS: 172.30.0.10:16180,172.30.0.11:16181,172.30.0.12:16182,172.30.0.13:16183,172.30.0.14:16184
    STOFFEL_MPC_BACKEND: ${STOFFEL_MPC_BACKEND:-honeybadger}
    STOFFEL_MPC_CURVE: ${STOFFEL_MPC_CURVE:-bls12-381}
    STOFFEL_COORD_ADDR: 172.30.0.5:31415
    STOFFEL_COORD_CERT: /app/ids/server_cert.crt
    STOFFEL_EXECUTION_ID: "${STOFFEL_EXECUTION_ID:-2222222222222222222222222222222222222222222222222222222222222222}"
    # Optional refusals: another roster, or an execution of another program.
    STOFFEL_EXPECT_ROSTER_DIGEST: ${STOFFEL_EXPECT_ROSTER_DIGEST-}
    STOFFEL_EXPECT_PROGRAM_HASH: ${STOFFEL_EXPECT_PROGRAM_HASH-}
    STOFFEL_CLIENT_DELAY: ${STOFFEL_CLIENT_DELAY:-20}
    RUST_LOG: ${RUST_LOG:-info}
    RUST_BACKTRACE: "1"

services:
  # The packaged programs exist only in the party image, and the coordinator
  # registers the hash of the program the parties run (§9.F.1), so this
  # one-shot service copies them onto a volume the coordinator mounts read-only.
  programs:
    build:
      context: .
      dockerfile: Dockerfile
      # TEMPORARY (§9.F.5): see the party build.
      additional_contexts:
        coordinator: "${STOFFEL_COORDINATOR_CONTEXT:?set STOFFEL_COORDINATOR_CONTEXT to the stoffel-mpc-coordinator 0.3.0 checkout until it is published}"
    entrypoint: ["/bin/sh", "-c", "cp -R /app/programs/. /programs/"]
    volumes:
      - stoffel-programs:/programs

  coordinator:
    configs: *coordinator-certificates
    secrets:
      - coordinator_key
    build:
      context: .
      dockerfile: docker/coordinator.Dockerfile
      # TEMPORARY (§9.F.5): the unpublished coordinator 0.3.0, copied to the
      # [patch.crates-io] path. Delete with the patch.
      additional_contexts:
        coordinator: "${STOFFEL_COORDINATOR_CONTEXT:?set STOFFEL_COORDINATOR_CONTEXT to the stoffel-mpc-coordinator 0.3.0 checkout until it is published}"
    container_name: stoffel-mesh-coordinator
    hostname: coordinator
    depends_on:
      programs:
        condition: service_completed_successfully
    volumes:
      - stoffel-programs:/app/programs:ro
    command:
      - --bind-addr
      - 0.0.0.0
      - --port
      - "31415"
      # The program this execution is registered for: the wrapper hashes these
      # bytes, and every party refuses a summary naming another program than
      # the one it loaded (docs/design/bootnode-elimination.md §9.D.7 step 1,
      # §9.F.1). Must be the parties' STOFFEL_PROGRAM.
      - --program
      - "${STOFFEL_PROGRAM:-/app/programs/mpc_aes128_circuit.stflb}"
      # The invocation every party and client of this stack joins. The
      # coordinator keys rounds, admissions, masked inputs and output shares
      # on it. This coordinator is a fresh process per `docker compose up`,
      # which registers the execution anew, so a constant is fine; a standing
      # coordinator needs a new value per run.
      - --execution-id
      - "${STOFFEL_EXECUTION_ID:-2222222222222222222222222222222222222222222222222222222222222222}"
      - --server-cert
      - /app/ids/server_cert.crt
      - --server-key
      - /run/secrets/coordinator_key
      # The node roster is these certificates and n is their number; t is the
      # one threshold of the stack (compose substitutes it from the invoking
      # shell, and it never reaches a party). Every client slot is registered
      # up front, one `<inputs>:<outputs>` entry per slot; under pre-registered
      # admission STOFFEL_CLIENT_CERTS names, in the same order, the
      # certificate bound to each. Both empty registers no client slots.
      - --node-certs
      - /app/ids/nodes/cert0.crt,/app/ids/nodes/cert1.crt,/app/ids/nodes/cert2.crt,/app/ids/nodes/cert3.crt,/app/ids/nodes/cert4.crt
      - --t
      - "${STOFFEL_THRESHOLD:-1}"
      - --client-io
      - "${STOFFEL_CLIENT_IO-}"
      - --client-certs
      - "${STOFFEL_CLIENT_CERTS-}"
      # How clients are admitted to the slots (§9.C.2, §9.F.3): pre-registered
      # (the default) binds STOFFEL_CLIENT_CERTS to the slots in order; open
      # names no client, so any certificate holder that pins this coordinator
      # may bind a free slot; invitation admits holders of an invitation that
      # STOFFEL_INVITATION_ISSUER_CERT's key signed (mount that certificate
      # into this service). Open and invitation need both deadlines, in seconds
      # after the coordinator starts. An empty value is an absent flag, and a
      # flag the chosen admission does not read makes the coordinator exit 2.
      - --admission
      - "${STOFFEL_ADMISSION:-pre-registered}"
      - --invitation-issuer-cert
      - "${STOFFEL_INVITATION_ISSUER_CERT-}"
      - --association-deadline-secs
      - "${STOFFEL_ASSOCIATION_DEADLINE_SECS-}"
      - --input-deadline-secs
      - "${STOFFEL_INPUT_DEADLINE_SECS-}"
    networks:
      stoffel-mesh-net:
        ipv4_address: 172.30.0.5
    ports:
      - "127.0.0.1:31415:31415/tcp"
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep -q ':31415' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  party0:
    configs:
      - *coordinator-pin
      - source: node0_cert
        target: /app/ids/nodes/cert0.crt
    secrets:
      - node0_key
    <<: *party-common
    container_name: stoffel-mesh-party0
    hostname: party0
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      <<: *party-env
      STOFFEL_PARTY_ID: "0"
      STOFFEL_BIND_ADDR: 172.30.0.10:9000
      STOFFEL_ADVERTISE_IP: 172.30.0.10
      STOFFEL_PEERS: 172.30.0.11:9001,172.30.0.12:9002,172.30.0.13:9003,172.30.0.14:9004
      STOFFEL_COORD_ADDR: 172.30.0.5:31415
      STOFFEL_COORD_CERT: /app/ids/server_cert.crt
      # The invocation this container joins. The coordinator keys every RPC on
      # it, so it must match the coordinator service's --execution-id and be
      # the same for every party and client of one run.
      STOFFEL_EXECUTION_ID: "${STOFFEL_EXECUTION_ID:-2222222222222222222222222222222222222222222222222222222222222222}"
      STOFFEL_RPC_ADDR: 172.30.0.10:16180
      STOFFEL_LOCAL_STORE: /app/mesh-store/party-0.redb
      STOFFEL_EPOCH_STORE: /app/mesh-store/epochs-party-0
      STOFFEL_CERT: /app/ids/nodes/cert0.crt
      STOFFEL_KEY: /run/secrets/node0_key
    networks:
      stoffel-mesh-net:
        ipv4_address: 172.30.0.10
    ports:
      - "127.0.0.1:9000:9000/tcp"
      - "127.0.0.1:9000:9000/udp"

  party1:
    configs:
      - *coordinator-pin
      - source: node1_cert
        target: /app/ids/nodes/cert1.crt
    secrets:
      - node1_key
    <<: *party-common
    container_name: stoffel-mesh-party1
    hostname: party1
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      <<: *party-env
      STOFFEL_PARTY_ID: "1"
      STOFFEL_BIND_ADDR: 172.30.0.11:9001
      STOFFEL_ADVERTISE_IP: 172.30.0.11
      STOFFEL_PEERS: 172.30.0.10:9000,172.30.0.12:9002,172.30.0.13:9003,172.30.0.14:9004
      STOFFEL_COORD_ADDR: 172.30.0.5:31415
      STOFFEL_COORD_CERT: /app/ids/server_cert.crt
      # The invocation this container joins. The coordinator keys every RPC on
      # it, so it must match the coordinator service's --execution-id and be
      # the same for every party and client of one run.
      STOFFEL_EXECUTION_ID: "${STOFFEL_EXECUTION_ID:-2222222222222222222222222222222222222222222222222222222222222222}"
      STOFFEL_RPC_ADDR: 172.30.0.11:16181
      STOFFEL_LOCAL_STORE: /app/mesh-store/party-1.redb
      STOFFEL_EPOCH_STORE: /app/mesh-store/epochs-party-1
      STOFFEL_CERT: /app/ids/nodes/cert1.crt
      STOFFEL_KEY: /run/secrets/node1_key
    networks:
      stoffel-mesh-net:
        ipv4_address: 172.30.0.11
    ports:
      - "127.0.0.1:9001:9001/tcp"
      - "127.0.0.1:9001:9001/udp"

  party2:
    configs:
      - *coordinator-pin
      - source: node2_cert
        target: /app/ids/nodes/cert2.crt
    secrets:
      - node2_key
    <<: *party-common
    container_name: stoffel-mesh-party2
    hostname: party2
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      <<: *party-env
      STOFFEL_PARTY_ID: "2"
      STOFFEL_BIND_ADDR: 172.30.0.12:9002
      STOFFEL_ADVERTISE_IP: 172.30.0.12
      STOFFEL_PEERS: 172.30.0.10:9000,172.30.0.11:9001,172.30.0.13:9003,172.30.0.14:9004
      STOFFEL_COORD_ADDR: 172.30.0.5:31415
      STOFFEL_COORD_CERT: /app/ids/server_cert.crt
      # The invocation this container joins. The coordinator keys every RPC on
      # it, so it must match the coordinator service's --execution-id and be
      # the same for every party and client of one run.
      STOFFEL_EXECUTION_ID: "${STOFFEL_EXECUTION_ID:-2222222222222222222222222222222222222222222222222222222222222222}"
      STOFFEL_RPC_ADDR: 172.30.0.12:16182
      STOFFEL_LOCAL_STORE: /app/mesh-store/party-2.redb
      STOFFEL_EPOCH_STORE: /app/mesh-store/epochs-party-2
      STOFFEL_CERT: /app/ids/nodes/cert2.crt
      STOFFEL_KEY: /run/secrets/node2_key
    networks:
      stoffel-mesh-net:
        ipv4_address: 172.30.0.12
    ports:
      - "127.0.0.1:9002:9002/tcp"
      - "127.0.0.1:9002:9002/udp"

  party3:
    configs:
      - *coordinator-pin
      - source: node3_cert
        target: /app/ids/nodes/cert3.crt
    secrets:
      - node3_key
    <<: *party-common
    container_name: stoffel-mesh-party3
    hostname: party3
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      <<: *party-env
      STOFFEL_PARTY_ID: "3"
      STOFFEL_BIND_ADDR: 172.30.0.13:9003
      STOFFEL_ADVERTISE_IP: 172.30.0.13
      STOFFEL_PEERS: 172.30.0.10:9000,172.30.0.11:9001,172.30.0.12:9002,172.30.0.14:9004
      STOFFEL_COORD_ADDR: 172.30.0.5:31415
      STOFFEL_COORD_CERT: /app/ids/server_cert.crt
      # The invocation this container joins. The coordinator keys every RPC on
      # it, so it must match the coordinator service's --execution-id and be
      # the same for every party and client of one run.
      STOFFEL_EXECUTION_ID: "${STOFFEL_EXECUTION_ID:-2222222222222222222222222222222222222222222222222222222222222222}"
      STOFFEL_RPC_ADDR: 172.30.0.13:16183
      STOFFEL_LOCAL_STORE: /app/mesh-store/party-3.redb
      STOFFEL_EPOCH_STORE: /app/mesh-store/epochs-party-3
      STOFFEL_CERT: /app/ids/nodes/cert3.crt
      STOFFEL_KEY: /run/secrets/node3_key
    networks:
      stoffel-mesh-net:
        ipv4_address: 172.30.0.13
    ports:
      - "127.0.0.1:9003:9003/tcp"
      - "127.0.0.1:9003:9003/udp"

  party4:
    configs:
      - *coordinator-pin
      - source: node4_cert
        target: /app/ids/nodes/cert4.crt
    secrets:
      - node4_key
    <<: *party-common
    container_name: stoffel-mesh-party4
    hostname: party4
    depends_on:
      coordinator:
        condition: service_healthy
    environment:
      <<: *party-env
      STOFFEL_PARTY_ID: "4"
      STOFFEL_BIND_ADDR: 172.30.0.14:9004
      STOFFEL_ADVERTISE_IP: 172.30.0.14
      STOFFEL_PEERS: 172.30.0.10:9000,172.30.0.11:9001,172.30.0.12:9002,172.30.0.13:9003
      STOFFEL_COORD_ADDR: 172.30.0.5:31415
      STOFFEL_COORD_CERT: /app/ids/server_cert.crt
      # The invocation this container joins. The coordinator keys every RPC on
      # it, so it must match the coordinator service's --execution-id and be
      # the same for every party and client of one run.
      STOFFEL_EXECUTION_ID: "${STOFFEL_EXECUTION_ID:-2222222222222222222222222222222222222222222222222222222222222222}"
      STOFFEL_RPC_ADDR: 172.30.0.14:16184
      STOFFEL_LOCAL_STORE: /app/mesh-store/party-4.redb
      STOFFEL_EPOCH_STORE: /app/mesh-store/epochs-party-4
      STOFFEL_CERT: /app/ids/nodes/cert4.crt
      STOFFEL_KEY: /run/secrets/node4_key
    networks:
      stoffel-mesh-net:
        ipv4_address: 172.30.0.14
    ports:
      - "127.0.0.1:9004:9004/tcp"
      - "127.0.0.1:9004:9004/udp"

  # Client 0. Started only with `--profile clients` (see the header). Its
  # certificate is mounted here and nowhere else: no party is told it, and the
  # coordinator reads it only when STOFFEL_CLIENT_CERTS pre-registers it.
  client0:
    profiles: [clients]
    configs:
      - *coordinator-pin
      - source: client0_cert
        target: /app/ids/clients/cert0.crt
    secrets:
      - client0_key
    <<: *client-common
    container_name: stoffel-mesh-client0
    hostname: client0
    environment:
      <<: *client-env
      STOFFEL_INPUTS: ${STOFFEL_CLIENT0_INPUT-3}
      STOFFEL_CLIENT_SLOT: ${STOFFEL_CLIENT0_SLOT-}
      STOFFEL_CERT: /app/ids/clients/cert0.crt
      STOFFEL_KEY: /run/secrets/client0_key
    networks:
      stoffel-mesh-net:
        ipv4_address: 172.30.0.100
    depends_on:
      coordinator:
        condition: service_healthy
      # No party of this stack has a healthcheck — every service is spelled the
      # same way — so the client waits STOFFEL_CLIENT_DELAY and then reaches the
      # parties' RPC listeners on its own.
      party0:
        condition: service_started

  # Client 1. Started only with `--profile clients` (see the header). Its
  # certificate is mounted here and nowhere else: no party is told it, and the
  # coordinator reads it only when STOFFEL_CLIENT_CERTS pre-registers it.
  client1:
    profiles: [clients]
    configs:
      - *coordinator-pin
      - source: client1_cert
        target: /app/ids/clients/cert1.crt
    secrets:
      - client1_key
    <<: *client-common
    container_name: stoffel-mesh-client1
    hostname: client1
    environment:
      <<: *client-env
      STOFFEL_INPUTS: ${STOFFEL_CLIENT1_INPUT-4}
      STOFFEL_CLIENT_SLOT: ${STOFFEL_CLIENT1_SLOT-}
      STOFFEL_CERT: /app/ids/clients/cert1.crt
      STOFFEL_KEY: /run/secrets/client1_key
    networks:
      stoffel-mesh-net:
        ipv4_address: 172.30.0.101
    depends_on:
      coordinator:
        condition: service_healthy
      # No party of this stack has a healthcheck — every service is spelled the
      # same way — so the client waits STOFFEL_CLIENT_DELAY and then reaches the
      # parties' RPC listeners on its own.
      party0:
        condition: service_started

networks:
  stoffel-mesh-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1

volumes:
  stoffel-programs:
  stoffel-mesh-store:

configs:
  coordinator_cert:
    file: ./ids/server_cert.crt
  node0_cert:
    file: ./ids/nodes/cert0.crt
  node1_cert:
    file: ./ids/nodes/cert1.crt
  node2_cert:
    file: ./ids/nodes/cert2.crt
  node3_cert:
    file: ./ids/nodes/cert3.crt
  node4_cert:
    file: ./ids/nodes/cert4.crt
  client0_cert:
    file: ./ids/clients/cert0.crt
  client1_cert:
    file: ./ids/clients/cert1.crt

secrets:
  client0_key:
    file: ./ids/clients/key0.der
  client1_key:
    file: ./ids/clients/key1.der
  coordinator_key:
    file: ./ids/server_key.der
  node0_key:
    file: ./ids/nodes/key0.der
  node1_key:
    file: ./ids/nodes/key1.der
  node2_key:
    file: ./ids/nodes/key2.der
  node3_key:
    file: ./ids/nodes/key3.der
  node4_key:
    file: ./ids/nodes/key4.der

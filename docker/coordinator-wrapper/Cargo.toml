[package]
name = "stoffel-coordinator-docker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stoffel-coordinator-docker"
path = "src/main.rs"

[workspace]

[dependencies]
ark-bn254 = "=0.5.0"
ark-bls12-381 = "=0.5.0"
ark-curve25519 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ed25519 = "=0.5.0"
ark-ff = "=0.5.0"
ark-secp256k1 = "=0.5.0"
ark-secp256r1 = "=0.5.0"
async-trait = "=0.1.88"
clap = { version = "=4.6.1", features = ["derive"] }
hex = "=0.4.3"
jsonrpsee = { version = "=0.26.0", features = ["full"] }
rustls = "=0.23.45"
stoffel-mpc-coordinator-off-chain = "=0.2.0"
stoffel-mpc-coordinator-shared = "=0.2.0"
stoffelmpc-mpc = { package = "stoffelcrypto", version = "=0.1.2" }
tokio = { version = "=1.46.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
x509-parser = "=0.18.1"

      # [patch.crates-io] path. Delete with the patch.
      additional_contexts:
        coordinator: "${STOFFEL_COORDINATOR_CONTEXT:?set STOFFEL_COORDINATOR_CONTEXT to the stoffel-mpc-coordinator 0.3.0 checkout until it is published}"
    container_name: stoffel-avss-party4
    hostname: party4
    environment:
      - STOFFEL_ROLE=party
      - STOFFEL_PARTY_ID=4
      - STOFFEL_BIND_ADDR=172.29.0.14:9004
      - STOFFEL_PROGRAM=${STOFFEL_PROGRAM:-/app/programs/avss_keygen.stflb}
      - STOFFEL_ENTRY=main
      - STOFFEL_MPC_BACKEND=avss
      - STOFFEL_MPC_CURVE=${STOFFEL_MPC_CURVE:-}
      - STOFFEL_LOCAL_STORE=/app/data/local.redb
      # Node identity, and the roster it is pinned to
      # (docs/design/bootnode-elimination.md §9.D): the node roster the
      # coordinator serves — the five certificates of its --node-certs — which
      # this party fetches once over the connection STOFFEL_COORD_CERT pins and
      # installs as the transport's peer-certificate allowlist, so membership
      # is enforced per connection by mTLS. No client certificate joins them:
      # this stack's clients are admitted by the coordinator and reach the
      # party's RPC listener (STOFFEL_RPC_ADDR). No party carries a roster, a
      # party count or a threshold of its own; the entrypoint refuses
      # STOFFEL_NODE_ROSTER, STOFFEL_N_PARTIES and STOFFEL_THRESHOLD by name.
      # Mesh seeds and epoch store; see party0 for what they are.
      - STOFFEL_PEERS=${STOFFEL_PEERS-172.29.0.10:9000,172.29.0.11:9001,172.29.0.12:9002,172.29.0.13:9003}
      - STOFFEL_EPOCH_STORE=/app/data/epochs
      - STOFFEL_CERT=/app/ids/nodes/cert4.crt
      - STOFFEL_KEY=/run/secrets/node4_key
      # The coordinator this party pins (--coord-cert), the invocation it
      # serves, and the RPC listener its clients' node legs reach.
      - STOFFEL_COORD_ADDR=172.29.0.5:31415
      - STOFFEL_COORD_CERT=/app/ids/server_cert.crt
      - STOFFEL_EXPECT_ROSTER_DIGEST=${STOFFEL_EXPECT_ROSTER_DIGEST-}
      - STOFFEL_EXECUTION_ID=${STOFFEL_EXECUTION_ID:-2222222222222222222222222222222222222222222222222222222222222222}
      - STOFFEL_RPC_ADDR=172.29.0.14:16184
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    volumes:
      - stoffel-avss-party4-local:/app/data
    networks:
      stoffel-avss-net:
        ipv4_address: 172.29.0.14
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_healthy
    ports:
      - "127.0.0.1:19004:9004/tcp"
      - "127.0.0.1:19004:9004/udp"

  # The certificate-signing fixture's output client (see the header). Started
  # only with `--profile clients`. Its certificate is mounted here and nowhere
  # else: no party is told it, and the coordinator reads it only when
  # STOFFEL_CLIENT_CERTS pre-registers it.
  client0:
    profiles: [clients]
    configs:
      - *coordinator-pin
      - source: client0_cert
        target: /app/ids/clients/cert0.crt
    secrets:
      - client0_key
    <<: *client-common
    container_name: stoffel-avss-client0
    hostname: client0
    environment:
      <<: *client-env
      STOFFEL_INPUTS: ${STOFFEL_CLIENT0_INPUT-}
      STOFFEL_CLIENT_SLOT: ${STOFFEL_CLIENT0_SLOT-}
      STOFFEL_CERT: /app/ids/clients/cert0.crt
      STOFFEL_KEY: /run/secrets/client0_key
    networks:
      stoffel-avss-net:
        ipv4_address: 172.29.0.100
    depends_on:
      coordinator:
        condition: service_healthy
      party0:
        condition: service_healthy

networks:
  stoffel-avss-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
          gateway: 172.29.0.1

volumes:
  stoffel-programs:
  stoffel-avss-party0-local:
  stoffel-avss-party1-local:
  stoffel-avss-party2-local:
  stoffel-avss-party3-local:
  stoffel-avss-party4-local:

configs:
  coordinator_cert:
    file: ./ids/server_cert.crt
  node0_cert:
    file: ./ids/nodes/cert0.crt
  node1_cert:
    file: ./ids/nodes/cert1.crt
  node2_cert:
    file: ./ids/nodes/cert2.crt
  node3_cert:
    file: ./ids/nodes/cert3.crt
  node4_cert:
    file: ./ids/nodes/cert4.crt
  client0_cert:
    file: ./ids/clients/cert0.crt
  client1_cert:
    file: ./ids/clients/cert1.crt

secrets:
  client0_key:
    file: ./ids/clients/key0.der
  coordinator_key:
    file: ./ids/server_key.der
  node0_key:
    file: ./ids/nodes/key0.der
  node1_key:
    file: ./ids/nodes/key1.der
  node2_key:
    file: ./ids/nodes/key2.der
  node3_key:
    file: ./ids/nodes/key3.der
  node4_key:
    file: ./ids/nodes/key4.der

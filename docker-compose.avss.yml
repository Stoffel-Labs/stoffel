# StoffelVM 5-Node AVSS DKG Test Environment
# This docker-compose file sets up a 5-node MPC network using the AVSS backend
# to perform distributed key generation. Each party runs Share.random() to
# generate a jointly-random secret, then extracts the public key from
# commitment[0]. All parties should output the same public key.
#
# This stack is also the local-store persistence testbed: each party mounts a
# named /app/data volume and passes STOFFEL_LOCAL_STORE to stoffel-run. The
# API/coordinator compose path is separate and currently uses the
# HoneyBadger/BLS12-381 coordinator flow.
#
# Usage:
#
# To run a different compiled Stoffel program:
#
# Threshold ECDSA fixtures:
#
# AVSS certificate fixture path:
#   1. Run /app/programs/avss_certificate_keygen.stflb with STOFFEL_MPC_CURVE=secp256k1 or p-256.
#      It loads an existing CA key share and only generates on first use.
#   2. Run /app/programs/avss_certificate_sign.stflb with STOFFEL_WAIT_FOR_CLIENTS=1.
#      The AVSS output client submits the real TBS digest and reconstructs r(32) || s(32).
#
# To use a different elliptic curve (default: bls12-381):
#
# Supported curves: bls12-381, bn254, curve25519, ed25519, secp256k1, p-256 (alias: secp256r1)
#
# To view logs from a specific party:
#   docker-compose -f docker-compose.avss.yml logs -f party0

# The coordinator decides what runs: it mints every execution identity and
# publishes each execution to the node roster, so no party is configured with
# one. The `registrar` service below asks it to run one execution of the
# packaged program, so `docker compose -f <this file> up` completes on its own.
#
# This stack has no client services, and the registrar submits a clientless
# admission. A fixture that does need a client (for example
# avss_certificate_sign.stflb with STOFFEL_WAIT_FOR_CLIENTS=1) therefore has to
# be driven by hand: bring the stack up with `--scale registrar=0`, submit the
# admission the fixture needs with the operator identity, and pass the identity
# it prints to the client as STOFFEL_EXECUTION_ID, because a client is not on
# the node roster and the coordinator publishes it nothing.
#
#   docker compose -f <this file> up -d --scale registrar=0 coordinator
#   docker compose -f <this file> run --rm --no-deps --entrypoint /app/stoffel-coord-ctl \
#     party0 submit --coordinator coordinator:31415 \
#     --coord-cert /app/ids/server_cert.crt \
#     --cert /app/ids/operator/cert.crt --key /app/ids/operator/key.der \
#     --program-file "$STOFFEL_PROGRAM" --entry "$STOFFEL_ENTRY" \
#     --client-slots <inputs>:<outputs> --open-admission

x-stoffel-build: &stoffel-build
  context: .
  dockerfile: Dockerfile
  additional_contexts:
    coordinator: "${STOFFEL_COORDINATOR_CONTEXT:?Set an absolute coordinator checkout}"
    networking: "${STOFFEL_NETWORK_CONTEXT:-https://github.com/Stoffel-Labs/stoffel-networking.git#v0.1.1}"

services:
  coordinator:
    build:
      context: .
      dockerfile: docker/coordinator.Dockerfile
      additional_contexts:
        coordinator: "${STOFFEL_COORDINATOR_CONTEXT:?Set an absolute coordinator checkout}"
    container_name: stoffel-avss-coordinator
    hostname: coordinator
    command:
      - --bind-addr
      - 0.0.0.0
      - --port
      - "31415"
      - --server-cert
      - /app/ids/server_cert.crt
      - --server-key
      - /app/ids/server_key.der
      - --t
      - "1"
      - --node-roster
      - /app/ids/nodes/cert0.crt,/app/ids/nodes/cert1.crt,/app/ids/nodes/cert2.crt,/app/ids/nodes/cert3.crt,/app/ids/nodes/cert4.crt
      # The only identity allowed to tell this coordinator what to run. It
      # mints every execution identity itself and publishes each execution
      # to the roster; the nodes have no say in what is submitted.
      - --operator-certs
      - /app/ids/operator/cert.crt
    networks:
      stoffel-avss-net:
        ipv4_address: 172.29.0.5
    ports:
      - "31415:31415/tcp"
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep -q ':31415' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One submission, over the operator's own authenticated link. It exits as soon
  # as the coordinator has minted and published the execution; the parties learn
  # of it on the subscriptions they already hold and never see this container.
  registrar:
    build: *stoffel-build
    container_name: stoffel-avss-registrar
    entrypoint: ["/app/stoffel-coord-ctl"]
    command:
      - submit
      - --coordinator
      - coordinator:31415
      - --coord-cert
      - /app/ids/server_cert.crt
      - --cert
      - /app/ids/operator/cert.crt
      - --key
      - /app/ids/operator/key.der
      - --program-file
      - ${STOFFEL_PROGRAM:-/app/programs/avss_keygen.stflb}
      - --entry
      - main
    depends_on:
      coordinator:
        condition: service_healthy
    restart: "no"
    networks:
      stoffel-avss-net:

  # Party 0. Every party is the same shape: it dials the addresses in
  # STOFFEL_PEERS and forms the mesh the coordinator's roster defines.
  party0:
    build: *stoffel-build
    container_name: stoffel-avss-party0
    hostname: party0
    environment:
      - STOFFEL_ROLE=party
      - STOFFEL_PARTY_ID=0
      - STOFFEL_BIND_ADDR=172.29.0.10:9000
      - STOFFEL_PEERS=172.29.0.11:9001,172.29.0.12:9002,172.29.0.13:9003,172.29.0.14:9004
      - STOFFEL_COORD_ADDR=172.29.0.5:31415
      - STOFFEL_COORD_CERT=/app/ids/server_cert.crt
      - STOFFEL_RPC_ADDR=172.29.0.10:16180
      - STOFFEL_CERT=/app/ids/nodes/cert0.crt
      - STOFFEL_KEY=/app/ids/nodes/key0.der
      - STOFFEL_N_PARTIES=5
      - STOFFEL_THRESHOLD=1
      - STOFFEL_PROGRAM=${STOFFEL_PROGRAM:-/app/programs/avss_keygen.stflb}
      - STOFFEL_ENTRY=main
      - STOFFEL_MPC_BACKEND=avss
      - STOFFEL_MPC_CURVE=${STOFFEL_MPC_CURVE:-}
      - STOFFEL_LOCAL_STORE=/app/data/local.redb
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    volumes:
      - stoffel-avss-party0-local:/app/data
    networks:
      stoffel-avss-net:
        ipv4_address: 172.29.0.10
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "19000:9000/tcp"
      - "19000:9000/udp"
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep -q ':9000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Party 1
  party1:
    build: *stoffel-build
    container_name: stoffel-avss-party1
    hostname: party1
    environment:
      - STOFFEL_ROLE=party
      - STOFFEL_PARTY_ID=1
      - STOFFEL_BIND_ADDR=172.29.0.11:9001
      - STOFFEL_PEERS=172.29.0.10:9000,172.29.0.12:9002,172.29.0.13:9003,172.29.0.14:9004
      - STOFFEL_COORD_ADDR=172.29.0.5:31415
      - STOFFEL_COORD_CERT=/app/ids/server_cert.crt
      - STOFFEL_RPC_ADDR=172.29.0.11:16181
      - STOFFEL_CERT=/app/ids/nodes/cert1.crt
      - STOFFEL_KEY=/app/ids/nodes/key1.der
      - STOFFEL_N_PARTIES=5
      - STOFFEL_THRESHOLD=1
      - STOFFEL_PROGRAM=${STOFFEL_PROGRAM:-/app/programs/avss_keygen.stflb}
      - STOFFEL_ENTRY=main
      - STOFFEL_MPC_BACKEND=avss
      - STOFFEL_MPC_CURVE=${STOFFEL_MPC_CURVE:-}
      - STOFFEL_LOCAL_STORE=/app/data/local.redb
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    volumes:
      - stoffel-avss-party1-local:/app/data
    networks:
      stoffel-avss-net:
        ipv4_address: 172.29.0.11
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "19001:9001/tcp"
      - "19001:9001/udp"

  # Party 2
  party2:
    build: *stoffel-build
    container_name: stoffel-avss-party2
    hostname: party2
    environment:
      - STOFFEL_ROLE=party
      - STOFFEL_PARTY_ID=2
      - STOFFEL_BIND_ADDR=172.29.0.12:9002
      - STOFFEL_PEERS=172.29.0.10:9000,172.29.0.11:9001,172.29.0.13:9003,172.29.0.14:9004
      - STOFFEL_COORD_ADDR=172.29.0.5:31415
      - STOFFEL_COORD_CERT=/app/ids/server_cert.crt
      - STOFFEL_RPC_ADDR=172.29.0.12:16182
      - STOFFEL_CERT=/app/ids/nodes/cert2.crt
      - STOFFEL_KEY=/app/ids/nodes/key2.der
      - STOFFEL_N_PARTIES=5
      - STOFFEL_THRESHOLD=1
      - STOFFEL_PROGRAM=${STOFFEL_PROGRAM:-/app/programs/avss_keygen.stflb}
      - STOFFEL_ENTRY=main
      - STOFFEL_MPC_BACKEND=avss
      - STOFFEL_MPC_CURVE=${STOFFEL_MPC_CURVE:-}
      - STOFFEL_LOCAL_STORE=/app/data/local.redb
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    volumes:
      - stoffel-avss-party2-local:/app/data
    networks:
      stoffel-avss-net:
        ipv4_address: 172.29.0.12
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "19002:9002/tcp"
      - "19002:9002/udp"

  # Party 3
  party3:
    build: *stoffel-build
    container_name: stoffel-avss-party3
    hostname: party3
    environment:
      - STOFFEL_ROLE=party
      - STOFFEL_PARTY_ID=3
      - STOFFEL_BIND_ADDR=172.29.0.13:9003
      - STOFFEL_PEERS=172.29.0.10:9000,172.29.0.11:9001,172.29.0.12:9002,172.29.0.14:9004
      - STOFFEL_COORD_ADDR=172.29.0.5:31415
      - STOFFEL_COORD_CERT=/app/ids/server_cert.crt
      - STOFFEL_RPC_ADDR=172.29.0.13:16183
      - STOFFEL_CERT=/app/ids/nodes/cert3.crt
      - STOFFEL_KEY=/app/ids/nodes/key3.der
      - STOFFEL_N_PARTIES=5
      - STOFFEL_THRESHOLD=1
      - STOFFEL_PROGRAM=${STOFFEL_PROGRAM:-/app/programs/avss_keygen.stflb}
      - STOFFEL_ENTRY=main
      - STOFFEL_MPC_BACKEND=avss
      - STOFFEL_MPC_CURVE=${STOFFEL_MPC_CURVE:-}
      - STOFFEL_LOCAL_STORE=/app/data/local.redb
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    volumes:
      - stoffel-avss-party3-local:/app/data
    networks:
      stoffel-avss-net:
        ipv4_address: 172.29.0.13
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "19003:9003/tcp"
      - "19003:9003/udp"

  # Party 4
  party4:
    build: *stoffel-build
    container_name: stoffel-avss-party4
    hostname: party4
    environment:
      - STOFFEL_ROLE=party
      - STOFFEL_PARTY_ID=4
      - STOFFEL_BIND_ADDR=172.29.0.14:9004
      - STOFFEL_PEERS=172.29.0.10:9000,172.29.0.11:9001,172.29.0.12:9002,172.29.0.13:9003
      - STOFFEL_COORD_ADDR=172.29.0.5:31415
      - STOFFEL_COORD_CERT=/app/ids/server_cert.crt
      - STOFFEL_RPC_ADDR=172.29.0.14:16184
      - STOFFEL_CERT=/app/ids/nodes/cert4.crt
      - STOFFEL_KEY=/app/ids/nodes/key4.der
      - STOFFEL_N_PARTIES=5
      - STOFFEL_THRESHOLD=1
      - STOFFEL_PROGRAM=${STOFFEL_PROGRAM:-/app/programs/avss_keygen.stflb}
      - STOFFEL_ENTRY=main
      - STOFFEL_MPC_BACKEND=avss
      - STOFFEL_MPC_CURVE=${STOFFEL_MPC_CURVE:-}
      - STOFFEL_LOCAL_STORE=/app/data/local.redb
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    volumes:
      - stoffel-avss-party4-local:/app/data
    networks:
      stoffel-avss-net:
        ipv4_address: 172.29.0.14
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "19004:9004/tcp"
      - "19004:9004/udp"

networks:
  stoffel-avss-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
          gateway: 172.29.0.1

volumes:
  stoffel-avss-party0-local:
  stoffel-avss-party1-local:
  stoffel-avss-party2-local:
  stoffel-avss-party3-local:
  stoffel-avss-party4-local:
